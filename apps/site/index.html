<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Doqs — Documentation that lives in your Angular app</title>
    <meta name="description" content="Doqs adds Markdown documentation to an existing Angular and Analog.js app — SSR/SSG, sidebar, table of contents and search — while your branding, routing and Angular components stay yours.">
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Doqs" />
    <meta property="og:title" content="Doqs — Documentation that lives in your Angular app" />
    <meta property="og:description" content="Markdown documentation for an existing Angular and Analog.js app, with your branding, routing and components intact." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Doqs — Documentation that lives in your Angular app" />
    <meta name="twitter:description" content="Markdown documentation for an existing Angular and Analog.js app, with your branding, routing and components intact." />
    <!-- origin-tags -->
    <script>
      // Apply the stored or system theme before first paint; Volt's provider takes over once Angular boots.
      try {
        var stored = localStorage.getItem('doqs-theme');
        var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
