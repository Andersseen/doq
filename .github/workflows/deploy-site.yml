name: Deploy site

# Deploys the static site (apps/site) to Cloudflare Pages with Wrangler (Direct Upload). Independent of npm releases.
#   push to main CI success  -> production deployment (branch "main")
#   same-repository PR CI success -> preview deployment (branch = PR branch, never production)
# Fork pull requests never reach this workflow's secrets: the workflow only starts from a completed CI run, runs only
# default-branch code, and treats the downloaded site as data (static files). See docs/operations/release-and-deployment.md.
# Cloudflare must hold this project as Direct Upload: do not also connect it to Git builds.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Deployments of one branch are serialized; a newer commit may supersede a queued (not a running) deployment.
concurrency:
  group: deploy-site-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions: {}

jobs:
  production:
    name: Production deployment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-pages-production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter site...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-dist
          path: apps/site/dist/analog/public
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::Cloudflare credentials are not configured: NOT DEPLOYED."
            echo "### NOT DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set for this environment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm --filter site exec wrangler pages deploy --branch=main --commit-hash="$COMMIT_SHA" --commit-dirty=false
          echo "### Deployed to Cloudflare Pages (production)" >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Preview deployment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to approve every preview.
    environment: cloudflare-pages-preview
    permissions:
      contents: read
      actions: read
    steps:
      # Default-branch code only: the pull request's own scripts and dependencies are never executed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter site...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site-dist
          path: apps/site/dist/analog/public
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Reject files that would change how Pages serves or runs the preview
        run: |
          set -euo pipefail
          cd apps/site/dist/analog/public
          if find . -maxdepth 1 \( -name '_worker.js' -o -name '_routes.json' -o -name 'functions' \) | grep -q .; then
            echo "::error::The preview artifact contains Pages worker/routing files; refusing to deploy it."
            exit 1
          fi
      - name: Deploy a preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::Cloudflare credentials are not configured: NO PREVIEW DEPLOYED."
            echo "### NO PREVIEW DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Defence in depth: a branch literally named like the production branch must never overwrite production.
          if [ "${PREVIEW_BRANCH}" = "main" ]; then echo "::error::refusing to deploy main as a preview"; exit 1; fi
          pnpm --filter site exec wrangler pages deploy --branch="${PREVIEW_BRANCH}" --commit-hash="$COMMIT_SHA" --commit-dirty=false
          echo "### Preview deployed to Cloudflare Pages (branch ${PREVIEW_BRANCH})" >> "$GITHUB_STEP_SUMMARY"
