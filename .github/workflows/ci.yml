name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  static:
    name: Static checks (format, types, Agentyx lock, specs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck:scripts
      - run: pnpm agentyx:check
      - name: Agentyx frozen install reproduces the committed files
        run: |
          pnpm exec agentyx install --frozen
          git diff --exit-code
      - run: pnpm sdd:check

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm test:components

  build:
    name: Production builds and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Optional repository variable: the public origin enables canonical URLs and the sitemap of apps/site.
          DOQ_SITE_ORIGIN: ${{ vars.DOQ_SITE_ORIGIN }}
      - run: pnpm pack:doq
      - run: pnpm verify:package "artifacts/doqs-analog-$(node -p "require('./packages/doq/package.json').version").tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: builds
          retention-days: 3
          if-no-files-found: error
          path: |
            artifacts/*.tgz
            apps/site/dist/analog/public
            apps/showcase-a/dist/analog/public
            apps/showcase-b/dist/analog/public
            apps/showcase-b/dist/analog-nosearch/public
      # Consumed by release.yml (exactly this verified tarball is what gets published) and deploy-site.yml (this exact site).
      - uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          retention-days: 14
          if-no-files-found: error
          path: artifacts/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          retention-days: 14
          if-no-files-found: error
          path: apps/site/dist/analog/public

  contract:
    name: Python contract tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: builds
      - run: pnpm test:contract

  e2e:
    name: Playwright E2E
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: builds
      - run: PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          retention-days: 7
          path: |
            test-results
            playwright-report

  acceptance:
    name: MVP and 0.1 acceptance harness
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:doq
      - run: pnpm consumer:build
        env:
          DOQ_CONSUMER_DIR: ${{ runner.temp }}/doq-consumer
      - name: Full CDP harness including the tarball-installed consumer
        run: pnpm verify:mvp
        env:
          MVP_CONSUMER_ROOT: ${{ runner.temp }}/doq-consumer/dist/analog/public
