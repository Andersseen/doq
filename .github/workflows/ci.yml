name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck:scripts
      - run: pnpm build
      - run: pnpm pack:doq
      - run: pnpm verify:package artifacts/getdoq-analog-0.1.0.tgz

  browser:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The external-consumer checks (M23 consumer, V01 consumer) need a separately installed app;
      # run those locally as described in scripts/verification/README.md.
      - run: pnpm verify:mvp --check=m15,m16,m17,m24,dynamic,v01
