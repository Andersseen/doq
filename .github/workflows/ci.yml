name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  static:
    name: Static checks (format, types, Agentyx lock, specs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck:scripts
      - run: pnpm agentyx:check
      - name: Agentyx frozen install reproduces the committed files
        run: |
          pnpm exec agentyx install --frozen
          git diff --exit-code
      - run: pnpm sdd:check

  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm test:components

  build:
    name: Production builds and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:doq
      - run: pnpm verify:package artifacts/getdoq-analog-0.1.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          retention-days: 3
          if-no-files-found: error
          path: |
            artifacts/*.tgz
            apps/showcase-a/dist/analog/public
            apps/showcase-b/dist/analog/public

  contract:
    name: Python contract tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contract/requirements.txt
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: builds
      - run: pnpm test:contract

  e2e:
    name: Playwright E2E
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: builds
      - run: PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          retention-days: 7
          path: |
            test-results
            playwright-report

  acceptance:
    name: MVP and 0.1 acceptance harness
    needs: build
    runs-on: ubuntu-latest
    env:
      DOQ_CONSUMER_DIR: ${{ runner.temp }}/doq-consumer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:doq
      - run: pnpm consumer:build
      - name: Full CDP harness including the tarball-installed consumer
        run: pnpm verify:mvp
        env:
          MVP_CONSUMER_ROOT: ${{ runner.temp }}/doq-consumer/dist/analog/public
