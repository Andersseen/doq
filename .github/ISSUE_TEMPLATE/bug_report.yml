name: Bug report
description: Doq behaves differently from its documented contract.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not report security vulnerabilities here; see SECURITY.md.
  - type: input
    id: doq
    attributes:
      label: Doq version
      placeholder: '@getdoq/analog 0.1.0 (or commit SHA)'
    validations: { required: true }
  - type: input
    id: stack
    attributes:
      label: Angular, Analog and Node versions
      placeholder: 'Angular 21.2.x, Analog 2.9.x, Node 22.x'
    validations: { required: true }
  - type: dropdown
    id: context
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        [Build / prerender (SSG), Server rendering (SSR), Browser after hydration, Packed npm artifact / install, Other]
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A repository link or the smallest config + Markdown that shows the problem.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      render: shell
