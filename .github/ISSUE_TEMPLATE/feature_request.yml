name: Feature request
description: Propose a change that solves a real documentation-site problem.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do in your application, and what stops you today?
    validations: { required: true }
  - type: textarea
    id: usecase
    attributes:
      label: Consumer use case
      description: Describe the documentation site (host app, content layout) that needs this.
    validations: { required: true }
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
  - type: textarea
    id: idea
    attributes:
      label: Idea (optional)
      description: A proposed API or behavior. The problem above matters more than the solution.
